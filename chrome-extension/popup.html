<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>GovCert</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; width: 280px; background: #fff; color: #1f2937; }
    .header { background: #071D41; color: #fff; padding: 14px 16px; border-bottom: 3px solid #FFCD07; display: flex; align-items: center; gap: 10px; }
    .header svg { width: 30px; height: 30px; flex-shrink: 0; }
    .header h1 { font-size: 14px; font-weight: 700; }
    .header p  { font-size: 10px; color: #adcdee; margin-top: 2px; }
    .body { padding: 14px 16px; }
    .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.active   { background: #22c55e; }
    .dot.inactive { background: #f59e0b; }
    .status-text { font-size: 12px; color: #374151; }
    .divider { border: none; border-top: 1px solid #e5e7eb; margin: 10px 0; }
    .btn { display: block; width: 100%; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: 600; text-align: center; cursor: pointer; border: none; margin-bottom: 6px; transition: background .15s; }
    .btn-primary   { background: #1351B4; color: #fff; }
    .btn-primary:hover { background: #0C326F; }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    .btn-secondary:hover { background: #e5e7eb; }
    .footer { padding: 8px 16px; font-size: 10px; color: #9ca3af; text-align: center; border-top: 1px solid #f3f4f6; }
    #user-id { font-size: 11px; color: #6b7280; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M28 4 L50 12 V27 C50 41 40 49 28 53 C16 49 6 41 6 27 V12 Z" fill="#1351B4"/>
      <path d="M28 4 L50 12 V18 L28 10 L6 18 V12 Z" fill="#FFCD07"/>
      <path d="M18 28 l7 7 l13 -15" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <h1>GovCert</h1>
      <p>Auditoria de IA — Governança Pública</p>
    </div>
  </div>

  <div class="body">
    <div class="status-row">
      <div class="dot" id="status-dot"></div>
      <span class="status-text" id="status-text">Verificando...</span>
    </div>

    <div id="user-id"></div>

    <hr class="divider">

    <button class="btn btn-primary" id="btn-dashboard">Abrir Dashboard</button>
    <button class="btn btn-secondary" id="btn-options">Configurações</button>
  </div>

  <div class="footer">v1.0.0 — GovCert</div>

  <script src="popup.js"></script>
</body>
</html>
